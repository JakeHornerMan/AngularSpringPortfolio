<app-ink-field class="water" [density]="1.15"></app-ink-field>

<header class="masthead">
    <a routerLink="/home" class="name display">{{sectionTitle.title$ | async}}</a>
</header>

<main class="page">
    <router-outlet></router-outlet>
    <!-- Inside the page so it layers above opened windows but below the page titles. -->
    <app-media-window></app-media-window>
</main>

<footer class="footer">
    <span>© {{year}} Jake Horner · cursors by <a href="http://www.rw-designer.com/cursor-set/antialiased-classic" target="_blank" rel="noopener">Vlasta</a> (CC BY)</span>
    <span class="footer-links" *ngIf="!isUserLoggedIn()">
        <a routerLink="/login">log in</a>
    </span>
    <span class="footer-links" *ngIf="isUserLoggedIn()">
        <a routerLink="/createProject">new project</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/createWorkExperience">new work</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/logout">log out</a>
    </span>
</footer>

<!-- The nav dock, flanked by bobbing arrows that slide between spaces of windows: down on both sides at the top,
     up on both sides at the bottom, and left down / right up anywhere in between. -->
<div class="dock-bar">
    <button type="button" class="more-arrows left down" (click)="nextSpace()" aria-label="Show the next windows">
        <img src="/assets/cursors/SmoothArrowDown.png" alt=""><img src="/assets/cursors/SmoothArrowDown.png" alt=""><img src="/assets/cursors/SmoothArrowDown.png" alt="">
    </button>
    <button type="button" class="more-arrows left up" (click)="previousSpace()" aria-label="Show the previous windows">
        <img src="/assets/cursors/SmoothArrowUp.png" alt=""><img src="/assets/cursors/SmoothArrowUp.png" alt=""><img src="/assets/cursors/SmoothArrowUp.png" alt="">
    </button>
    <nav class="dock" aria-label="Main">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">home</a>
        <a routerLink="/workExperiences" routerLinkActive="active">work</a>
        <a routerLink="/interest/3" routerLinkActive="active">software</a>
        <a routerLink="/interest/1" routerLinkActive="active">games</a>
        <a routerLink="/interest/2" routerLinkActive="active">art</a>
    </nav>
    <button type="button" class="more-arrows right up" (click)="previousSpace()" aria-label="Show the previous windows" tabindex="-1">
        <img src="/assets/cursors/SmoothArrowUp.png" alt=""><img src="/assets/cursors/SmoothArrowUp.png" alt=""><img src="/assets/cursors/SmoothArrowUp.png" alt="">
    </button>
    <button type="button" class="more-arrows right down" (click)="nextSpace()" aria-label="Show the next windows" tabindex="-1">
        <img src="/assets/cursors/SmoothArrowDown.png" alt=""><img src="/assets/cursors/SmoothArrowDown.png" alt=""><img src="/assets/cursors/SmoothArrowDown.png" alt="">
    </button>
</div>

<!-- The joke "virus" that floods the screen with terminals before a link opens in a new tab. -->
<app-terminal-swarm></app-terminal-swarm>

<app-intro-loader></app-intro-loader>
