<app-ink-field class="water" [density]="1.15"></app-ink-field>

<header class="masthead">
    <a routerLink="/home" class="name display">Jake Horner</a>
</header>

<main class="page">
    <router-outlet></router-outlet>
</main>

<footer class="footer">
    <span>© {{year}} Jake Horner</span>
    <span class="footer-links" *ngIf="!isUserLoggedIn()">
        <a routerLink="/login">log in</a>
    </span>
    <span class="footer-links" *ngIf="isUserLoggedIn()">
        <a routerLink="/createProject">new project</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/createWorkExperience">new work</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/logout">log out</a>
    </span>
</footer>

<nav class="dock" aria-label="Main">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">home</a>
    <a routerLink="/interest/1" routerLinkActive="active">games</a>
    <a routerLink="/interest/2" routerLinkActive="active">art</a>
    <a routerLink="/interest/3" routerLinkActive="active">software</a>
    <a routerLink="/workExperiences" routerLinkActive="active">work</a>
</nav>

<app-intro-loader></app-intro-loader>
