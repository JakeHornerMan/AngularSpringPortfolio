<div class="preview">
    <app-project-content [project]="data.project" [open]="true"></app-project-content>
    <div class="dialog-actions">
        <button class="solid-btn outline" [mat-dialog-close]="false">Close</button>
        <button *ngIf="data.isSaving" class="solid-btn" [mat-dialog-close]="true">Save</button>
    </div>
</div>
