<div class="slider" *ngIf="slides.length" (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)">
    <div class="stage">
        <ng-container *ngFor="let slide of slides; let i = index">
            <ng-container *ngIf="i === index">
                <img *ngIf="slide.kind === 'image'" [src]="slide.url" [alt]="slide.title || title" draggable="false">
                <iframe *ngIf="slide.kind === 'embed'" [src]="slide.url" [title]="slide.title || title"
                    allow="autoplay; fullscreen; encrypted-media; picture-in-picture; xr-spatial-tracking" allowfullscreen></iframe>
            </ng-container>
        </ng-container>

        <ng-container *ngIf="slides.length > 1">
            <button type="button" class="arrow prev" (click)="go(-1)" aria-label="Previous">‹</button>
            <button type="button" class="arrow next" (click)="go(1)" aria-label="Next">›</button>
        </ng-container>
    </div>

    <div class="controls" *ngIf="slides.length > 1">
        <button type="button" *ngFor="let slide of slides; let i = index" class="dot" [class.current]="i === index"
            (click)="index = i" [attr.aria-label]="'Show ' + (i + 1) + ' of ' + slides.length" [attr.aria-current]="i === index"></button>
        <span class="count">{{index + 1}} / {{slides.length}}</span>
    </div>
</div>
