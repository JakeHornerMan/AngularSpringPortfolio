<div #win class="pocket video-window" *ngIf="video" role="dialog" [attr.aria-label]="video.title">
    <span class="label has-dots">
        <button type="button" class="window-open" aria-expanded="true" (click)="close()">
            <span class="window-dots" aria-hidden="true"></span>close ↖
        </button>
        <span class="bar-title">{{video.title}}</span>
    </span>
    <div class="video-frame">
        <iframe *ngIf="embedUrl" [src]="embedUrl" [title]="video.title" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
        <video *ngIf="fileUrl" [src]="fileUrl" autoplay controls playsinline></video>
    </div>
</div>
