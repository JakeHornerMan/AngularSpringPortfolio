<div class="block block-split" *ngIf="paragraphList.length >= 1">
    <div>
        <h2 *ngIf="content.contentTitle">{{content.contentTitle}}</h2>
        <p *ngFor="let paragraph of paragraphList">{{paragraph}}</p>
    </div>
    <img [src]="content.contentUrl" [alt]="content.contentTitle || ''" class="block-media" loading="lazy">
</div>
<div class="block" *ngIf="paragraphList.length <= 0">
    <h2 *ngIf="content.contentTitle">{{content.contentTitle}}</h2>
    <img [src]="content.contentUrl" [alt]="content.contentTitle || ''" class="block-media" loading="lazy">
</div>
