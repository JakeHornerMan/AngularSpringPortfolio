<div class="block block-split" *ngIf="!isEmpty(content.contentParagraph)">
    <div>
        <h2 *ngIf="content.contentTitle">{{content.contentTitle}}</h2>
        <p *ngFor="let paragraph of paragraphList">{{paragraph}}</p>
    </div>
    <ng-container *ngTemplateOutlet="media"></ng-container>
</div>
<div class="block" *ngIf="isEmpty(content.contentParagraph)">
    <h2 *ngIf="content.contentTitle">{{content.contentTitle}}</h2>
    <ng-container *ngTemplateOutlet="media"></ng-container>
</div>

<ng-template #media>
    <!-- Desktop: a small tile; the video plays in a window of its own (MediaWindowComponent). -->
    <button *ngIf="!inline" type="button" class="media-tile" #tileButton (click)="play(tileButton)" [attr.aria-label]="'Play ' + (content.contentTitle || 'video')"
        (mouseenter)="previewClip($event, true)" (mouseleave)="previewClip($event, false)">
        <img *ngIf="thumbnail" [src]="thumbnail" alt="" loading="lazy">
        <!-- A video file has no thumbnail, so the tile shows the clip itself (from 3s in, past any black intro), playing like a GIF while hovered. -->
        <video *ngIf="!thumbnail && !embedUrl" [src]="content.contentUrl + '#t=3'" muted loop playsinline preload="metadata" aria-hidden="true"></video>
        <span class="media-tile-badge" aria-hidden="true">▶ play</span>
    </button>
    <!-- Phones and tablets: the player sits inline. -->
    <div *ngIf="inline" class="video-frame inline-media">
        <iframe *ngIf="embedUrl" [src]="embedUrl" [title]="content.contentTitle || 'Video'" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>
        <video *ngIf="!embedUrl" [src]="content.contentUrl" controls playsinline preload="metadata"></video>
    </div>
</ng-template>
