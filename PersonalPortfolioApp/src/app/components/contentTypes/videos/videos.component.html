<div class="block block-split" *ngIf="!isEmpty(content.contentParagraph)">
    <div>
        <h2 *ngIf="content.contentTitle">{{content.contentTitle}}</h2>
        <p *ngFor="let paragraph of paragraphList">{{paragraph}}</p>
    </div>
    <div class="video-frame">
        <iframe [src]="contentUrl" [title]="content.contentTitle || 'Video'" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
</div>
<div class="block" *ngIf="isEmpty(content.contentParagraph)">
    <h2 *ngIf="content.contentTitle">{{content.contentTitle}}</h2>
    <div class="video-frame">
        <iframe [src]="contentUrl" [title]="content.contentTitle || 'Video'" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
</div>
