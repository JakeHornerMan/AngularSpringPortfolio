<div class="pop-up" *ngIf="areYouSure == false">
    <h1>Delete this?</h1>
    <div class="dialog-actions">
        <button class="solid-btn outline" [mat-dialog-close]="false">Cancel</button>
        <button class="solid-btn" (click)="areYouSure = true">Yes</button>
    </div>
</div>
<div class="pop-up" *ngIf="areYouSure == true">
    <h1>Are you sure?</h1>
    <div class="dialog-actions">
        <button class="solid-btn outline" [mat-dialog-close]="false">Cancel</button>
        <button class="solid-btn" [mat-dialog-close]="true">Delete</button>
    </div>
</div>
