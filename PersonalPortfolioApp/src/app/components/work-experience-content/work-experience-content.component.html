<article class="pocket">
    <span class="label has-dots">
        <button type="button" class="window-open" *ngIf="contentList?.length; else plainDots" (click)="toggle()" [attr.aria-expanded]="open">
            <span class="window-dots" aria-hidden="true"></span>{{open ? 'close ↖' : 'open ↘'}}
        </button>
        <ng-template #plainDots><span class="window-dots" aria-hidden="true"></span></ng-template>
        <span class="bar-title">{{barTitle || workExperience.workPlace}}</span>
    </span>

    <div class="work-head">
        <img *ngIf="workExperience.workIconUrl" [src]="workExperience.workIconUrl" alt="" class="work-icon">
        <div>
            <h1 class="pocket-title">{{workExperience.workPlace}}</h1>
            <p class="muted">{{workExperience.workTitle}}</p>
            <p class="pocket-meta">{{workExperience.startDate | date:'MMM yyyy'}} – {{workExperience.endDate ? (workExperience.endDate | date:'MMM yyyy') : 'now'}}</p>
        </div>
    </div>

    <p *ngIf="workExperience.workDescription">{{workExperience.workDescription}}</p>
    <p class="muted" *ngIf="workExperience.technologys">{{workExperience.technologys}}</p>

    <div class="pocket-actions" *ngIf="isUserLoggedIn()">
        <button class="text-btn" (click)="editWorkExperience(workExperience.id)">edit</button>
        <button class="text-btn" (click)="removeWorkExperience(workExperience.id)">delete</button>
    </div>

    <div class="pocket-body" *ngIf="open">
        <ng-container *ngFor="let content of contentList">

            <ng-container *ngIf="content.contentType == 'text'">
                <app-paragraphs [content]="content"></app-paragraphs>
            </ng-container>

            <ng-container *ngIf="content.contentType == 'video'">
                <app-videos [content]="content"></app-videos>
            </ng-container>

            <ng-container *ngIf="content.contentType == 'image'">
                <app-images [content]="content"></app-images>
            </ng-container>

            <ng-container *ngIf="content.contentType == 'link'">
                <app-links [content]="content"></app-links>
            </ng-container>

        </ng-container>
    </div>
</article>
