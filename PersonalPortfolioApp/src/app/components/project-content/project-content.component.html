<article class="pocket">
    <span class="label has-dots">
        <button type="button" class="window-open" *ngIf="hasMore(); else plainDots" (click)="toggle()" [attr.aria-expanded]="open">
            <span class="window-dots" aria-hidden="true"></span>{{open ? 'close ↖' : 'open ↘'}}
        </button>
        <ng-template #plainDots><span class="window-dots" aria-hidden="true"></span></ng-template>
        <span class="bar-title">{{project.projectName}}</span>
    </span>

    <h1 class="pocket-title">{{project.projectName}}</h1>
    <p class="pocket-meta"><span *ngIf="project.staredProject">featured · </span>{{project.startDate | date:'yyyy'}}<ng-container *ngIf="project.endDate && (project.endDate | date:'yyyy') != (project.startDate | date:'yyyy')">–{{project.endDate | date:'yyyy'}}</ng-container></p>

    <ul class="dash-list" *ngIf="liList.length > 0">
        <li *ngFor="let li of liList">{{li}}</li>
    </ul>
    <p *ngIf="summary()">{{summary()}}</p>

    <div class="pocket-actions" *ngIf="isUserLoggedIn()">
        <button class="text-btn" (click)="editProject(project.id)">edit</button>
        <button class="text-btn" (click)="removeProject(project.id)">delete</button>
    </div>

    <div class="pocket-body" *ngIf="open">
        <ng-container *ngFor="let block of blocks">

            <!-- A screenshot dump, three to a row. -->
            <div class="block" *ngIf="block.gallery">
                <h2 *ngIf="block.content.contentTitle">{{block.content.contentTitle}}</h2>
                <div class="media-grid">
                    <app-images *ngFor="let image of block.gallery" [content]="image" [bare]="true"></app-images>
                </div>
            </div>

            <ng-container *ngIf="!block.gallery">

                <ng-container *ngIf="block.content.contentType == 'text'">
                    <app-paragraphs [content]="block.content"></app-paragraphs>
                </ng-container>

                <ng-container *ngIf="block.content.contentType == 'video'">
                    <app-videos [content]="block.content"></app-videos>
                </ng-container>

                <ng-container *ngIf="block.content.contentType == 'image'">
                    <app-images [content]="block.content"></app-images>
                </ng-container>

                <ng-container *ngIf="block.content.contentType == 'link'">
                    <app-links [content]="block.content"></app-links>
                </ng-container>

            </ng-container>

        </ng-container>
    </div>
</article>
