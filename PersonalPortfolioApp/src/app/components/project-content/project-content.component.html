<article class="pocket">
    <span class="label">
        <span *ngIf="project.staredProject">featured · </span>{{project.startDate | date:'yyyy'}}<ng-container *ngIf="project.endDate && (project.endDate | date:'yyyy') != (project.startDate | date:'yyyy')">–{{project.endDate | date:'yyyy'}}</ng-container>
    </span>

    <h1 class="pocket-title">{{project.projectName}}</h1>

    <ul class="dash-list" *ngIf="liList.length > 0">
        <li *ngFor="let li of liList">{{li}}</li>
    </ul>
    <p *ngIf="project.projectDescription">{{project.projectDescription}}</p>

    <div class="pocket-actions">
        <button class="text-btn" *ngIf="contentList?.length" (click)="toggle()" [attr.aria-expanded]="open">
            {{open ? 'close ↖' : 'open ↘'}}
        </button>
        <ng-container *ngIf="isUserLoggedIn()">
            <button class="text-btn" (click)="editProject(project.id)">edit</button>
            <button class="text-btn" (click)="removeProject(project.id)">delete</button>
        </ng-container>
    </div>

    <div class="pocket-body" *ngIf="open">
        <ng-container *ngFor="let content of contentList">

            <ng-container *ngIf="content.contentType == 'text'">
                <app-paragraphs [content]="content"></app-paragraphs>
            </ng-container>

            <ng-container *ngIf="content.contentType == 'video'">
                <app-videos [content]="content"></app-videos>
            </ng-container>

            <ng-container *ngIf="content.contentType == 'image'">
                <app-images [content]="content"></app-images>
            </ng-container>

            <ng-container *ngIf="content.contentType == 'link'">
                <app-links [content]="content"></app-links>
            </ng-container>

        </ng-container>
    </div>
</article>
